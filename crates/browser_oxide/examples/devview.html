<!doctype html>
<meta charset="utf-8">
<title>browser_oxide devview</title>
<style>
  :root { color-scheme: dark; --bg:#16171a; --line:#2e3038; --fg:#d8dae0; --dim:#8a8f9a;
          --acc:#5aa9e6; --warn:#e0a24a; --bad:#e0685a; --ok:#5ac47a; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; grid-template-columns: minmax(0,1fr) clamp(280px,34vw,460px);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); color:var(--fg); }
  /* Console sits under the mirror rather than behind a tab: engine errors are
     most useful while watching the action they came from. */
  #left { display:grid; grid-template-rows: minmax(0,1fr) clamp(120px,26vh,320px); min-width:0; }
  #stage { position:relative; overflow:hidden; }
  #console { border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  #chead { display:flex; gap:6px; align-items:center; padding:4px 8px; border-bottom:1px solid var(--line); }
  #chead b { color:var(--acc); font-weight:600; font-size:12px; }
  #chead button { background:#1e2026; border:1px solid var(--line); color:var(--dim);
                  padding:1px 7px; border-radius:10px; cursor:pointer; font:inherit; font-size:11px; }
  #chead button.on { background:var(--acc); border-color:var(--acc); color:#0b0c0e; font-weight:600; }
  #cfind { flex:1; min-width:60px; background:#111; border:1px solid var(--line); color:var(--fg);
           padding:1px 6px; border-radius:4px; font:inherit; font-size:11px; }
  #cclear { margin-left:auto; }
  #clist { flex:1; overflow:auto; padding:2px 0; font-size:11px; }
  .cline { padding:1px 8px; border-bottom:1px solid #202228; white-space:pre-wrap; word-break:break-all; }
  .cline.error { color:var(--bad); } .cline.warn { color:var(--warn); }
  .cline.info { color:var(--acc); } .cline .ts { color:var(--dim); margin-right:6px; }
  /* Default before the first snapshot's real viewport size is known; `fitMirror`
     overrides both with inline styles (exact profile pixels, scaled down to fit
     the stage) the moment it is. `position:absolute` takes it out of flow —
     `transform` doesn't shrink an element's own layout footprint, only its
     paint, so an in-flow iframe set to the profile's full (often 1000px+)
     height fed that size straight into #left's grid track and grew #stage to
     match, shoving the console out of view. Same fix `#overlay` already uses. */
  #mirror { position:absolute; top:0; left:0; border:0; width:100%; height:100%;
            background:#fff; transform-origin:0 0; }
  /* The engine has no cursor; this overlay draws where its behaviour generator
     believes the pointer is, so the synthesised path is visible while it happens. */
  #overlay { position:absolute; inset:0; pointer-events:none; }
  #cursor { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
            border:2px solid var(--acc); background:rgba(90,169,230,.25); transition:none; display:none; }
  #cursor.press { border-color:var(--warn); background:rgba(224,162,74,.45); transform:scale(.7); }
  aside { border-left:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
  header { padding:7px 10px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  header b { color:var(--acc); font-weight:600; }
  #conn { margin-left:auto; font-size:11px; }
  #conn.on { color:var(--ok); } #conn.off { color:var(--bad); }
  nav { display:flex; border-bottom:1px solid var(--line); }
  nav button { flex:1; background:none; border:0; border-bottom:2px solid transparent; color:var(--dim);
               padding:7px 4px; cursor:pointer; font:inherit; font-size:12px; }
  nav button.on { color:var(--fg); border-bottom-color:var(--acc); }
  section { flex:1; overflow:auto; padding:6px 9px; display:none; }
  section.on { display:block; }
  .row { padding:4px 6px; border-bottom:1px solid var(--line); cursor:pointer; word-break:break-all; }
  .row:hover { background:#24262c; }
  .t { color:var(--acc); } .dim { color:var(--dim); } .bad { color:var(--bad); }
  .warn { color:var(--warn); } .ok { color:var(--ok); }
  /* Network panel ---------------------------------------------------------- */
  #netbar { display:flex; gap:4px; flex-wrap:wrap; padding:5px 0 7px; position:sticky; top:-6px;
            background:var(--bg); z-index:2; border-bottom:1px solid var(--line); margin-bottom:4px; }
  #netbar button { background:#1e2026; border:1px solid var(--line); color:var(--dim);
                   padding:2px 8px; border-radius:10px; cursor:pointer; font:inherit; font-size:11px; }
  #netbar button.on { background:var(--acc); border-color:var(--acc); color:#0b0c0e; font-weight:600; }
  #netfind { flex:1; min-width:80px; background:#111; border:1px solid var(--line); color:var(--fg);
             padding:2px 6px; border-radius:4px; font:inherit; font-size:11px; }
  .nrow { display:flex; gap:6px; align-items:baseline; padding:3px 4px; border-bottom:1px solid var(--line);
          cursor:pointer; font-size:12px; }
  .nrow:hover { background:#24262c; }
  .nrow.open { background:#22262e; }
  .nrow .st { width:30px; flex:none; text-align:right; }
  .nrow .kd { width:44px; flex:none; font-size:10px; color:var(--dim); text-transform:uppercase; }
  .nrow .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nrow .sz { flex:none; color:var(--dim); font-size:11px; }
  .ndet { background:#101116; border-bottom:1px solid var(--line); padding:6px 8px; }
  .ndet h4 { margin:6px 0 3px; font-size:11px; color:var(--acc); font-weight:600; }
  .ndet pre { margin:0; white-space:pre-wrap; word-break:break-all; max-height:280px; overflow:auto;
              font:inherit; font-size:11px; color:var(--fg); }
  .ndet .kv { color:var(--dim); }
  #bar { padding:6px 9px; border-top:1px solid var(--line); display:flex; gap:6px; }
  #bar input { flex:1; min-width:0; background:#111; border:1px solid var(--line); color:var(--fg);
               padding:5px 7px; border-radius:4px; font:inherit; }
  #bar button { background:var(--acc); border:0; color:#0b0c0e; padding:5px 11px; border-radius:4px;
                cursor:pointer; font:inherit; font-weight:600; }
  /* Frame substitution in the mirror (see frameBox). */
  .bo-frame { display:inline-block; overflow:auto; vertical-align:top; position:relative; }
  .bo-frame-body { }
  #sel { padding:4px 9px; border-top:1px solid var(--line); color:var(--dim); word-break:break-all; font-size:11px; }
  #status, #counts { padding:3px 10px; border-bottom:1px solid var(--line); font-size:11px; word-break:break-all; }
  #chalbadge { font-size:11px; }
</style>

<div id="left">
  <div id="stage">
    <iframe id="mirror" sandbox="allow-same-origin"></iframe>
    <svg id="overlay"><polyline id="trail" fill="none" stroke="#5aa9e6" stroke-width="1.5" opacity=".55"/></svg>
    <div id="cursor"></div>
  </div>
  <div id="console">
    <div id="chead">
      <b>Консоль</b>
      <button class="cf on" data-l="">все</button>
      <button class="cf" data-l="error">ошибки</button>
      <button class="cf" data-l="warn">ворнинги</button>
      <input id="cfind" placeholder="фильтр…">
      <span id="ccount" class="dim"></span>
      <button id="cclear">очистить</button>
    </div>
    <div id="clist"></div>
  </div>
</div>

<aside>
  <header><b>devview</b><span id="chalbadge" class="dim"></span><span id="conn" class="off">●&nbsp;нет связи</span></header>
  <div><button id="tdump">trace</button><button id="tclear">clear trace</button><button id="tdownload">download</button></div>
  <div id="counts" class="dim"></div>
  <div id="status" class="dim">запуск…</div>
  <nav>
    <button class="on" data-tab="acts">Элементы</button>
    <button data-tab="net">Сеть</button>
  </nav>
  <section id="acts" class="on"></section>
  <section id="net">
    <div id="netbar">
      <button class="on" data-k="">Все</button>
      <button data-k="doc">Doc</button>
      <button data-k="script">JS</button>
      <button data-k="css">CSS</button>
      <button data-k="xhr">XHR</button>
      <button data-k="img">Img</button>
      <button data-k="font">Font</button>
      <button data-k="other">Проч.</button>
      <input id="netfind" placeholder="фильтр по URL…">
    </div>
    <div id="netlist"><div class="dim">нет запросов</div></div>
  </section>
  <div id="sel" class="dim">селектор не выбран</div>
  <div id="bar">
    <input id="text" placeholder="текст для ввода…">
    <button id="fill">Ввести</button>
    <button id="click">Клик</button>
  </div>
</aside>

<script>
  let picked = null, lastHtml = '';
  // A gesture in flight. The mirror is rebuilt by reassigning `srcdoc`, which
  // throws the whole document away — so a snapshot arriving mid-drag would
  // destroy the very element being dragged. Redraws are held until the pointer
  // comes back up, and the last snapshot is applied then.
  let dragging = false, pendingSnap = null, lastMoveSent = 0;
  // Typing has the same problem as dragging, for a different reason: rebuilding
  // `srcdoc` drops the browser's focus out of the mirror, so the next keystroke
  // goes nowhere. Redraws are held for a moment after each key and applied once
  // the burst stops.
  let lastKeyAt = 0;
  const KEY_QUIET_MS = 700;
  let lastFrameDocs = [];
  let lastFrameRealms = [];
  let framesDirty = false;
  const canvasMeta = new Map(), canvasPng = new Map();
  const frameDocsByPath = new Map(), frameMetaByPath = new Map();
  const canvasKey = key => JSON.stringify(key || {});
  const surfaceKey = key => (key.framePath || []).join('.') + '~' + key.generation + '~' + key.canvasId;
  let trail = [], t0 = Date.now();
  const $ = (id) => document.getElementById(id);

  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === b.dataset.tab));
  });

  // ---- socket -----------------------------------------------------------------
  let ws = null;
  function connect() {
    ws = new WebSocket('ws://127.0.0.1:__WS_PORT__');
    ws.onopen = () => {
      $('conn').className = 'on'; $('conn').textContent = '● связь';
      // Frame documents are streamed change-only, so a view that just opened —
      // or reloaded, or reconnected after the engine restarted — would be told
      // "unchanged" about markup it has never seen. Ask for the record to be
      // dropped so the next snapshot carries every frame in full.
      lastFrameDocs.length = 0;
      send({ action: 'resync' });
    };
    ws.onclose = () => {
      $('conn').className = 'off'; $('conn').textContent = '● нет связи';
      setTimeout(connect, 1000);
    };
    // A swallowed exception here is indistinguishable from "the engine sent
    // nothing": the view just stops updating, with an empty console to explain
    // it. Report it in the console drawer the same way an engine error is.
    ws.onmessage = (e) => {
      try { handle(JSON.parse(e.data)); }
      catch (err) { log('ошибка в devview: ' + (err && err.message || err), 'bad'); }
    };
  }
  const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  connect();

  $('click').onclick = () => picked && send({ action: 'click', sel: picked, text: '' });
  $('fill').onclick = () => picked && send({ action: 'fill', sel: picked, text: $('text').value });
  $('tdump').onclick = () => send({ action: 'trace', op: 'dump' });
  $('tclear').onclick = () => send({ action: 'trace', op: 'clear' });
  $('tdownload').onclick = () => send({ action: 'trace', op: 'download' });

  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function log(text, cls) {
    const el = $('status');
    el.className = cls || 'dim';
    el.textContent = `+${((Date.now() - t0) / 1000).toFixed(1)}с  ${text}`;
    addConsole([{ level: cls === 'bad' ? 'error' : cls === 'warn' ? 'warn' : 'info', text }]);
  }

  // ---- console ------------------------------------------------------------------
  // Engine console output (page realm and every child frame) plus this view's own
  // driver events, in one stream — a widget's failure and the action that caused it
  // are only diagnosable next to each other.
  const conAll = [];
  let conLevel = '', conStick = true;

  document.querySelectorAll('#chead .cf').forEach(b => b.onclick = () => {
    document.querySelectorAll('#chead .cf').forEach(x => x.classList.toggle('on', x === b));
    conLevel = b.dataset.l; renderConsole();
  });
  $('cfind').oninput = renderConsole;
  $('cclear').onclick = () => { conAll.length = 0; renderConsole(); };
  // Stop auto-scrolling as soon as the user scrolls up to read something.
  $('clist').onscroll = () => {
    const el = $('clist');
    conStick = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
  };

  // The engine tags every console argument with its type. That is useful for
  // objects and errors and pure noise for strings, which is most of the stream.
  // Collapse runs of spaces only — newlines carry the stack trace of an Error.
  const untag = (t) => String(t).replace(/\[string\] /g, '').replace(/[ \t]{2,}/g, ' ').trim();

  function addConsole(items) {
    if (!items || !items.length) return;
    const ms = ((Date.now() - t0) / 1000).toFixed(1);
    for (const it of items) conAll.push({ ts: ms, level: it.level || 'log', text: untag(it.text) });
    if (conAll.length > 2000) conAll.splice(0, conAll.length - 2000);
    renderConsole();
  }

  function renderConsole() {
    const q = $('cfind').value.trim().toLowerCase();
    const list = conAll.filter(c =>
      (!conLevel || c.level === conLevel) && (!q || c.text.toLowerCase().includes(q)));
    const errs = conAll.filter(c => c.level === 'error').length;
    const warns = conAll.filter(c => c.level === 'warn').length;
    $('ccount').textContent = `${conAll.length} · ошибок ${errs} · ворнингов ${warns}`;
    $('clist').innerHTML = list.map(c =>
      `<div class="cline ${c.level}"><span class="ts">+${c.ts}с</span>${esc(c.text)}</div>`).join('')
      || '<div class="cline dim">пусто</div>';
    if (conStick) $('clist').scrollTop = $('clist').scrollHeight;
  }

  function handle(msg) {
    if (msg.kind === 'status') { log(msg.text, 'ok'); return; }
    if (msg.kind === 'log') { log(msg.text, 'warn'); return; }
    if (msg.kind === 'trace') {
      if (msg.op === 'download') {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([msg.jsonl || ''], { type: 'application/jsonl' }));
        a.download = 'browser-oxide-trace.jsonl'; a.click(); URL.revokeObjectURL(a.href);
      } else if (msg.op === 'dump') {
        addConsole(String(msg.jsonl || '').split('\n').filter(Boolean).map(text => ({ level: 'info', text })));
      } else log('trace очищен', 'ok');
      return;
    }
    if (msg.kind === 'action') {
      const ms = msg.ms != null ? ` (${msg.ms} мс)` : '';
      log(`${msg.raw} → ${msg.state}${ms}`, msg.state.startsWith('ошибк') ? 'bad' : '');
      return;
    }
    if (msg.kind !== 'snapshot') return;
    if (msg.net && msg.net.length) addNet(msg.net);
    if (msg.console && msg.console.length) addConsole(msg.console);
    lastFrameRealms = msg.frameRealms || lastFrameRealms;
    if (msg.frameTree) {
      for (const frame of msg.frameTree) {
        const key = (frame.framePath || []).join('.');
        const previous = frameMetaByPath.get(key);
        if (previous && previous.generation !== frame.generation) frameDocsByPath.delete(key);
        frameMetaByPath.set(key, frame);
        if (frame.html !== null) {
          frameDocsByPath.set(key, frame.html);
          framesDirty = true;
        }
      }
    }
    if (msg.canvasUpdates) {
      for (const update of msg.canvasUpdates) {
        if (!update || !update.meta) continue;
        const key = canvasKey(update.meta.key);
        canvasMeta.set(key, update.meta);
        if (update.png) canvasPng.set(key, update.png);
      }
    }
    // `null` for a frame means "unchanged" — keep what we already have.
    if (msg.frameDocs) {
      // A frame's document arrives in its own snapshot, after the one that
      // carried the page markup — and the page markup then stops changing. Without
      // marking the mirror dirty the frame box renders once, empty, forever.
      // A changed canvas bitmap is not a changed document.
      //
      // The snapshot embeds each canvas as a data URL inside the frame's
      // markup, so an animating canvas made every document differ on every
      // tick — and the mirror answered by rebuilding its whole srcdoc several
      // times a second. The iframe reloaded each time: the captcha flickered,
      // its heading re-laid out mid-webfont, and an open challenge looked like
      // it was closing itself. While the canvas was blank this never showed,
      // because a blank bitmap encodes to the same bytes every time.
      //
      // Structure decides whether to rebuild; the bitmaps are swapped into the
      // live <img> elements afterwards, which costs no layout at all.
      msg.frameDocs.forEach(function (d, i) {
        if (d === null || d === lastFrameDocs[i]) return;
        lastFrameDocs[i] = d;
        framesDirty = true;
      });
      // Deliberately not truncated to the incoming length. `null` means "unchanged",
      // so this array is the only copy — and the engine will not resend a document
      // it has already decided is unchanged. One short array (a frame momentarily
      // out of the tree) would drop a document permanently, leaving a box that
      // reads "пусто" for the rest of the session.
    }
    paint(msg.data);
  }

  // ---- network ------------------------------------------------------------------
  // Records arrive incrementally (each carries a monotonic seq), so the panel owns
  // the full history — the engine only ever sends what this view has not seen.
  const netAll = [];
  let netKind = '', netOpen = null;

  document.querySelectorAll('#netbar button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#netbar button').forEach(x => x.classList.toggle('on', x === b));
    netKind = b.dataset.k; renderNet();
  });
  $('netfind').oninput = renderNet;

  function addNet(recs) { for (const r of recs) netAll.push(r); renderNet(); }

  const shortName = (u) => {
    try {
      const p = new URL(u);
      const last = p.pathname.split('/').filter(Boolean).pop() || p.hostname;
      return last + (p.search ? p.search.slice(0, 24) : '');
    } catch (_) { return u; }
  };
  const host = (u) => { try { return new URL(u).hostname; } catch (_) { return ''; } };
  const kb = (n) => n < 1024 ? n + ' Б' : (n / 1024).toFixed(1) + ' КБ';

  function renderNet() {
    const q = $('netfind').value.trim().toLowerCase();
    const list = netAll.filter(r =>
      (!netKind || r.kind === netKind) && (!q || r.url.toLowerCase().includes(q)));
    if (!list.length) { $('netlist').innerHTML = '<div class="dim">нет запросов</div>'; return; }
    $('netlist').innerHTML = list.slice().reverse().map(r => {
      const cls = r.status === 0 ? 'bad' : r.status >= 400 ? 'bad' : r.status >= 300 ? 'warn' : 'ok';
      const row = `<div class="nrow ${netOpen === r.seq ? 'open' : ''}" data-seq="${r.seq}">
          <span class="st ${cls}">${r.status || '—'}</span>
          <span class="kd">${r.kind}</span>
          <span class="nm" title="${esc(r.url)}">${esc(shortName(r.url))}
            <span class="dim">· ${esc(host(r.url))}</span></span>
          <span class="sz">${kb(r.size)}</span>
        </div>`;
      return row + (netOpen === r.seq ? detail(r) : '');
    }).join('');
    document.querySelectorAll('#netlist .nrow').forEach(el => el.onclick = () => {
      const s = Number(el.dataset.seq);
      netOpen = netOpen === s ? null : s;
      renderNet();
    });
  }

  // Request and response side by side. A refusal is rarely explained by the
  // answer alone — the question is what went out: which headers carried the
  // session, what the payload actually said.
  function detail(r) {
    const fmt = list => (list || []).map(([k, v]) => `${k}: ${v}`).join('\n') || '—';
    const bodyOr = (b, empty) => b ? esc(b) : `<span class="dim">${empty}</span>`;
    return `<div class="ndet">
      <h4>Запрос</h4>
      <pre class="kv">${r.method} ${esc(r.url)}</pre>
      <h4>Заголовки запроса</h4>
      <pre>${esc(fmt(r.reqHeaders))}</pre>
      <h4>Тело запроса</h4>
      <pre>${bodyOr(r.reqBody, 'без тела')}${r.reqBodyTruncated ? `\n<span class="bad">обрезано: показано ${kb(r.reqBody.length)} из ${kb(r.reqSize)}</span>` : ''}</pre>
      <h4>Ответ</h4>
      <pre class="kv">${r.status} · ${esc(r.mime || 'без Content-Type')} · ${kb(r.size)}</pre>
      <h4>Заголовки ответа</h4>
      <pre>${esc(fmt(r.headers))}</pre>
      <h4>Тело ответа</h4>
      <pre>${bodyOr(r.body, 'тело не текстовое либо пустое')}</pre>
    </div>`;
  }

  // ---- mirror sizing -------------------------------------------------------------
  // The mirror used to just fill the stage at 100%/100%, independent of the
  // engine's actual viewport (a desktop profile is commonly 1900-2500px wide,
  // the stage panel a fraction of that). `srcdoc` content reflows to whatever
  // width its iframe renders at, so responsive CSS — anything with a media
  // query or a breakpoint — laid out differently in the narrow mirror than it
  // did on the engine's real, wide viewport. A click's `u`/`v` fraction (of
  // the mirror's own width) then landed over different content when scaled
  // back up against the real page: the button that looked centered in the
  // mirror wasn't at that same fraction across the real 2000+px layout.
  // Rendering the iframe at the profile's *actual* CSS pixel size and scaling
  // the whole thing down visually with a transform makes the two identical —
  // same breakpoints, same layout — so a fraction means the same thing in
  // both places. `drawCursor` below already assumed this and computed its own
  // scale from `clientWidth` vs `contentWindow.innerWidth`; it was the mirror
  // that hadn't been sized to make that ratio meaningful.
  let lastKnownViewport = null, lastFitKey = null;
  function fitMirror(viewport) {
    if (viewport && viewport[0] && viewport[1]) lastKnownViewport = viewport;
    if (!lastKnownViewport) return;
    const [vw, vh] = lastKnownViewport;
    const f = $('mirror'), st = $('stage');
    const stageW = st.clientWidth, stageH = st.clientHeight;
    if (!stageW || !stageH) return;
    const key = vw + 'x' + vh + '@' + stageW + 'x' + stageH;
    if (key === lastFitKey) return;
    lastFitKey = key;
    const scale = Math.min(stageW / vw, stageH / vh);
    f.style.width = vw + 'px';
    f.style.height = vh + 'px';
    f.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', () => fitMirror(null));

  // ---- cursor overlay ----------------------------------------------------------
  function drawCursor(samples, lastPos) {
    const f = $('mirror'), st = $('stage');
    // `clientWidth` is the untransformed layout box — `transform: scale()`
    // (see `fitMirror`) doesn't move it, only the rendered pixels. The overlay
    // draws over what's actually on screen, so it needs the rendered size.
    const renderedWidth = f.getBoundingClientRect().width;
    const scaleX = renderedWidth / (f.contentWindow?.innerWidth || renderedWidth || 1);
    for (const s of samples) trail.push([s.x, s.y]);
    if (trail.length > 220) trail = trail.slice(-220);
    const pts = trail.map(([x, y]) => `${Math.round(x * scaleX)},${Math.round(y * scaleX)}`).join(' ');
    $('trail').setAttribute('points', pts);
    const at = lastPos || (trail.length ? trail[trail.length - 1] : null);
    if (at) {
      const c = $('cursor');
      c.style.display = 'block';
      c.style.left = Math.round(at[0] * scaleX) + 'px';
      c.style.top = Math.round(at[1] * scaleX) + 'px';
    }
    if (samples.length) {
      const c = $('cursor');
      c.classList.add('press');
      clearTimeout(drawCursor._t);
      drawCursor._t = setTimeout(() => c.classList.remove('press'), 120);
    }
  }

  // Turns one serialised <iframe …data-bo-frame="N"…> into a box carrying the
  // child realm's own document.
  // A <canvas> bitmap lives outside markup. `canvasUpdates` supplies a lossless
  // backing-store PNG, so the mirror substitutes a keyed <img> without touching
  // the frame document.
  // Backgrounds the engine inlined for us: the element carries the picture as
  // a data URL because its own `blob:` reference means nothing in this browser.
  function applyBlobBackgrounds(root) {
    root.querySelectorAll('[data-bo-bg],[data-bo-box]').forEach(el => {
      const d = el.getAttribute('data-bo-bg');
      if (d) el.style.backgroundImage = 'url("' + d + '")';
      const box = String(el.getAttribute('data-bo-box') || '').split(',').map(Number);
      if (box.length === 2) {
        const rect = el.getBoundingClientRect();
        if (rect.width <= 0 && box[0] > 0) el.style.width = box[0] + 'px';
        if (rect.height <= 0 && box[1] > 0) el.style.height = box[1] + 'px';
      }
    });
  }

  // Some challenge canvases are intentionally positioned across the header,
  // with the prompt kept readable by a higher sibling stacking layer. Preserve
  // that relationship even when the mirror has lost the runtime-applied class.
  function repairCanvasPromptLayers(root) {
    root.querySelectorAll('[data-bo-canvas="1"]').forEach(canvas => {
      // Headings belonging to the *same widget* only — Epic's own page has
      // headings scattered everywhere (a section title, a dialog caption),
      // and one can coincidentally overlap the canvas's on-screen rect with
      // nothing to do with it. Searching the whole document meant the
      // ancestor walk below found no shared container closer than <body>,
      // then "promptLayer" became whichever top-level section happened to
      // hold that unrelated heading — once bumping the entire login dialog's
      // z-index a point above the captcha it was supposed to stay under.
      const scope = canvas.closest('.bo-frame') || canvas.parentElement;
      if (!scope) return;
      const cr = canvas.getBoundingClientRect();
      scope.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(heading => {
        if (!heading.textContent.trim()) return;
        const hr = heading.getBoundingClientRect();
        if (hr.right <= cr.left || hr.left >= cr.right || hr.bottom <= cr.top || hr.top >= cr.bottom) return;
        let common = heading.parentElement;
        while (common && !common.contains(canvas)) common = common.parentElement;
        if (!common) return;
        let promptLayer = heading, canvasLayer = canvas;
        while (promptLayer.parentElement !== common) promptLayer = promptLayer.parentElement;
        while (canvasLayer.parentElement !== common) canvasLayer = canvasLayer.parentElement;
        if (promptLayer === canvasLayer) return;
        const promptStyle = getComputedStyle(promptLayer);
        if (promptStyle.position === 'static') promptLayer.style.position = 'relative';
        const z = Math.max(Number.parseInt(getComputedStyle(canvasLayer).zIndex, 10) || 0,
                           Number.parseInt(getComputedStyle(canvas).zIndex, 10) || 0);
        promptLayer.style.zIndex = String(Math.max(z + 1, Number.parseInt(promptStyle.zIndex, 10) || 0));
      });
    });
  }

  let canvasRealm = { framePath: [], generation: 0, index: 0 };
  function canvasShot(tag) {
    const index = canvasRealm.index++;
    const meta = Array.from(canvasMeta.values()).find(m =>
      m.canvasIndex === index && m.key.generation === canvasRealm.generation &&
      JSON.stringify(m.key.framePath || []) === JSON.stringify(canvasRealm.framePath));
    const opening = /^<canvas\b([^>]*)>/i.exec(tag);
    let attrs = opening ? opening[1] : '';
    const style = (/\bstyle="([^"]*)"/.exec(attrs) || [])[1] || '';
    attrs = attrs.replace(/\sstyle="[^"]*"/i, '');
    if (!meta) return '<span data-bo-canvas="missing" style="' + style + '"></span>';
    const key = canvasKey(meta.key);
    const w = Math.max(0, meta.cssRect[2]), h = Math.max(0, meta.cssRect[3]);
    return '<canvas' + attrs + ' data-bo-canvas="1" data-bo-key="' + encodeURIComponent(key) +
           '" data-bo-surface="' + surfaceKey(meta.key) + '"' +
           ' style="' + style + ';display:block;width:' + w + 'px;height:' + h +
           'px;background-color:#141821;background-size:100% 100%;background-repeat:no-repeat"></canvas>';
  }

  let frameRenderParentPath = [];
  function frameBox(tag) {
    const m = /data-bo-frame="(\d+)"/.exec(tag);
    const i = m ? Number(m[1]) : -1;
    const realm = Array.from(frameMetaByPath.values()).find(frame =>
      frame.slot === i && JSON.stringify(frame.parentPath || []) === JSON.stringify(frameRenderParentPath));
    const topMeta = frameRenderParentPath.length === 0 && lastFrames ? lastFrames[i] : null;
    const meta = topMeta || null;
    const w = meta ? meta.box[0] : (realm && realm.cssRect ? realm.cssRect[2] : 0);
    const h = meta ? meta.box[1] : (realm && realm.cssRect ? realm.cssRect[3] : 0);
    const src = meta ? meta.src : 'iframe';
    // Parse the role from the *unmodified* src: stripping `&` first glued the
    // next parameter onto it ("checkbox" + "id" → "checkboxid").
    // Computed before the hidden-frame branch below, which reads it too — a
    // `const` used above its declaration is a ReferenceError, and a captcha's
    // frames are hidden most of the time, so that path is the common one.
    const raw = String(src);
    const role = (/#frame=([a-z-]+)/i.exec(raw) || [])[1] || '';
    let host = '';
    try { host = new URL(raw).hostname; } catch (_) {}
    const label = (role || host || raw.slice(0, 40)).replace(/[<>&"]/g, '');
    // Hidden frames contribute nothing: the engine keeps their document alive
    // (that is how the challenge stays ready), but drawing it would paste the
    // captcha's text over the page.
    if (meta && meta.shown === false) {
      return '<div class="bo-frame" data-bo-idx="' + i + '" title="frame ' + i + ' · ' +
             label + ' · скрыт" style="width:' + w + 'px;height:' + h + 'px"></div>';
    }
    let inner = realm ? (frameDocsByPath.get((realm.framePath || []).join('.')) || '')
                      : (lastFrameDocs[i] || '');
    // The child document gets the same treatment as the top one, recursively:
    // no scripts; nested frames are substituted recursively from the frame tree.
    const canvasFrame = realm || lastFrameRealms.find(r => r.slot === i) ||
      { framePath: [], generation: 0 };
    const previousCanvasRealm = canvasRealm;
    const previousFramePath = frameRenderParentPath;
    canvasRealm = { framePath: canvasFrame.framePath || [], generation: canvasFrame.generation || 0, index: 0 };
    frameRenderParentPath = canvasFrame.framePath || [];
    inner = String(inner)
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/<iframe\b[^>]*>[\s\S]*?<\/iframe>/gi, frameBox)
      .replace(/<iframe\b[^>]*>/gi, frameBox)
      .replace(/<noscript[\s\S]*?<\/noscript>/gi, '')
      .replace(/<canvas\b[^>]*>[\s\S]*?<\/canvas>/gi, canvasShot)
      .replace(/<canvas\b(?![^>]*data-bo-canvas)[^>]*>/gi, canvasShot);
    canvasRealm = previousCanvasRealm;
    frameRenderParentPath = previousFramePath;
    const size = (w && h) ? (w + '×' + h) : 'без размера';
    // No visible label: the index is only needed by the click router (it rides in
    // the attribute) and the role/size are already shown in the selector line when
    // you click. A caption over the frame is just noise on top of the captcha.
    return '<div class="bo-frame" data-bo-idx="' + i + '" title="frame ' + i + ' · ' +
           label + ' · ' + size + '" style="width:' + (w || 300) +
           'px;height:' + (h || 150) + 'px">' +
           '<div class="bo-frame-body">' + (inner || '<i>пусто</i>') + '</div></div>';
  }

  let lastFrames = [];

  // A burst of typing holds redraws back; this lets the last one through once
  // the keyboard goes quiet.
  setInterval(() => {
    if (dragging || !pendingSnap) return;
    if (Date.now() - lastKeyAt < KEY_QUIET_MS) return;
    const p = pendingSnap; pendingSnap = null; paint(p);
  }, 250);

  // Live canvas refresh during a gesture.
  //
  // Rebuilding the mirror mid-drag would replace the very node the pointer is
  // holding, so redraws are held back until release. Holding the canvas bitmaps
  // back with them made a drag look dead: the engine moved the piece on every
  // pointermove and the viewer watched a frozen picture. Only the <img> src is
  // swapped here — no node is replaced and no layout is rebuilt, so the gesture
  // survives while the drawing keeps up.
  function refreshCanvasShots() {
    const f = $('mirror');
    const d = f && f.contentDocument;
    if (!d) return;
    for (const img of d.querySelectorAll('[data-bo-canvas="1"][data-bo-key]')) {
      let key;
      try { key = decodeURIComponent(img.getAttribute('data-bo-key')); } catch (_) { continue; }
      // A page may replace the DOM canvas at the same document slot without
      // changing its serialised HTML. Keep the live <img> bound to that slot,
      // otherwise it retains the previous surface id and every pointer event is
      // evaluated against a canvas which no longer exists.
      const previous = canvasMeta.get(key);
      const meta = previous && Array.from(canvasMeta.values()).reverse().find(m =>
        m.canvasIndex === previous.canvasIndex &&
        m.key.generation === previous.key.generation &&
        JSON.stringify(m.key.framePath || []) === JSON.stringify(previous.key.framePath || [])
      ) || previous;
      if (!meta) continue;
      const currentKey = canvasKey(meta.key);
      const shot = canvasPng.get(currentKey);
      if (shot && img.style.backgroundImage !== 'url("' + shot + '")') {
        img.style.backgroundImage = 'url("' + shot + '")';
      }
      if (currentKey !== key) {
        img.setAttribute('data-bo-key', encodeURIComponent(currentKey));
        img.setAttribute('data-bo-surface', surfaceKey(meta.key));
      }
      img.style.width = Math.max(0, meta.cssRect[2]) + 'px';
      img.style.height = Math.max(0, meta.cssRect[3]) + 'px';
    }
    repairCanvasPromptLayers(d);
  }

  function paint(s) {
    lastFrames = s.frames || [];
    $('counts').textContent = s.counts
      ? `${s.counts.elements} эл · ${s.counts.inputs} input · ${s.counts.buttons} button` : '';

    fitMirror(s.viewport);

    // Bitmaps are always swapped in place — during a gesture, when a redraw is
    // held back, and on an ordinary tick where nothing structural changed.
    refreshCanvasShots();

    if (s.html && (s.html !== lastHtml || framesDirty)) {
      if (dragging || Date.now() - lastKeyAt < KEY_QUIET_MS) { pendingSnap = s; return; }
      framesDirty = false;
      // Author CSS now reaches the mirror, so no cosmetic overrides are needed.
      // These two compensate for state the engine leaves unfinished: MUI writes
      // `opacity: 0` inline and animates it from JS that never completes here, and
      // the app pins body{overflow:hidden} for a scroll container it never wires up.
      const unfinished = `<style>
        html,body{overflow:auto!important;}
        /* The frame boxes need their styling *inside* the mirror: this markup
           lives in the iframe's srcdoc, which the viewer page's own stylesheet
           never reaches. Without the positioning, a frame box was static, so an
           absolutely positioned element inside a frame — hCaptcha pins its
           Privacy/Terms links with bottom/right — resolved against the mirror's
           body and flew to the corner of the page. Clipping matches what a
           real iframe does with content past its edge. */
        .bo-frame{position:relative;display:inline-block;overflow:hidden;vertical-align:top;}
        /* Only in the top document. Inside a frame box this was a lie: hCaptcha
           hides its own error banner with opacity 0, and forcing it visible
           made "Please try again" show permanently, along with every other
           element the widget keeps hidden. */
        [style*="opacity: 0;"]:not(.bo-frame *),[style$="opacity: 0"]:not(.bo-frame *){opacity:1!important;}
      </style>`;
      canvasRealm = { framePath: [], generation: 0, index: 0 };
      const html = s.html
        // The mirror deliberately runs without allow-scripts — re-running the SPA
        // here would show Chrome's render, not the engine's DOM. Strip what that
        // makes noisy rather than loosening the sandbox:
        //  · <noscript> would otherwise cover the real DOM with "enable JavaScript"
        //  · nested iframes can never run, and each logs a sandbox violation
        //  · <script> cannot run either, yet Chrome still fetches every one of them —
        //    module scripts are CORS-fetched regardless of the attribute, so each is
        //    a console error and a pointless round trip
        //  · preload hints for assets nothing will consume warn on every load
        //  · crossorigin on fonts fails CORS from 127.0.0.1
        .replace(/<noscript[\s\S]*?<\/noscript>/gi, '')
        .replace(/<canvas\b[^>]*>[\s\S]*?<\/canvas>/gi, canvasShot)
        .replace(/<canvas\b(?![^>]*data-bo-canvas)[^>]*>/gi, canvasShot)
        // Frames are substituted, not dropped. A real <iframe> here cannot help:
        // the mirror runs without allow-scripts, so it would render blank, and
        // allowing scripts would re-run the third party inside the viewer's own
        // browser — showing Chrome's result instead of the engine's. So each frame
        // becomes a labelled box holding the document the engine built for it.
        .replace(/<iframe\b[^>]*>[\s\S]*?<\/iframe>/gi, frameBox)
        .replace(/<iframe\b[^>]*>/gi, frameBox)
        .replace(/<script[\s\S]*?<\/script>/gi, '')
        .replace(/<script[^>]*\/?>/gi, '')
        .replace(/<link[^>]+rel=["']?(?:module)?preload["']?[^>]*>/gi, '')
        .replace(/\scrossorigin(=(["'])[^"']*\2|=[^\s>]+)?/gi, '')
        // Web fonts are always fetched in CORS mode, whatever the attribute says, so
        // from 127.0.0.1 every @font-face is a console error. Drop them and let the
        // mirror fall back to system faces — metrics shift slightly, layout does not.
        .replace(/@font-face\s*\{[^}]*\}/gi, '')
        .replace(/<head([^>]*)>/i, `<head$1><base href="${s.url}">${unfinished}`);
      // Only once the transform above has survived. Marking the markup as drawn
      // before doing the drawing means one throw in `frameBox` retires the
      // mirror for good: every later snapshot carries the same html, compares
      // equal, and skips the render — a blank pane with nothing in the console.
      lastHtml = s.html;
      const f = $('mirror');
      f.srcdoc = html;
      f.onload = () => {
        const d = f.contentDocument; if (!d) return;
        // A fresh document means fresh focus. Put it back where the user was
        // typing, otherwise the keystroke after a redraw is swallowed.
        if (Date.now() - lastKeyAt < 3000) {
          try { f.contentWindow.focus(); d.body && d.body.focus && d.body.focus(); } catch (_) {}
        }
        d.addEventListener('click', ev => {
          ev.preventDefault();
          // A click landing inside a frame box belongs to that frame's realm —
          // the mirror is a copy, so the click has to be replayed in the engine,
          // and replaying it against the top document would miss entirely.
          // Selection only. The interaction itself already travelled through
          // the pointer path below (down → move → up), which ends in a real
          // click in the engine; sending `frameclick` here too would deliver
          // the click twice.
          const box = ev.target.closest && ev.target.closest('.bo-frame');
          if (box) {
            const idx = box.getAttribute('data-bo-idx');
            const body = box.querySelector('.bo-frame-body');
            $('sel').textContent = 'frame ' + idx + ' → ' + selectorWithin(body, ev.target);
            picked = null;
            return;
          }
          pick(selectorFor(ev.target));
        }, true);
        d.addEventListener('submit', ev => ev.preventDefault(), true);
        applyBlobBackgrounds(d);
        refreshCanvasShots();

        // ---- raw pointer forwarding -------------------------------------
        // The viewer's own gesture goes to the engine step by step. A drag
        // cannot be replayed as a click, and the captcha asks for exactly that.
        const targetOf = (ev) => {
          const el = ev.target;
          if (!el || !el.getBoundingClientRect) return null;
          const box = el.closest && el.closest('.bo-frame');
          const r = el.getBoundingClientRect();
          // Offsets are element-relative on purpose: the mirror lays the page
          // out at its own width, so its absolute pixels are not the engine's.
          let ox = Math.round(ev.clientX - r.left);
          let oy = Math.round(ev.clientY - r.top);
          const frame = box ? box.getAttribute('data-bo-idx') : null;

          // Canvas input carries only a stable surface identity and normalized
          // coordinates. The child realm resolves those against its current
          // engine rect, never against bitmap or mirror pixels.
          const shot = el.closest && el.closest('[data-bo-canvas]');
          if (shot) {
            const sr = shot.getBoundingClientRect();
            return {
              surface: shot.getAttribute('data-bo-surface') || '',
              u: Math.max(0, Math.min(1, (ev.clientX - sr.left) / Math.max(1, sr.width))),
              v: Math.max(0, Math.min(1, (ev.clientY - sr.top) / Math.max(1, sr.height))),
            };
          }
          // `u`/`v` are normalized against the FRAME's own box, not the clicked
          // element's — same discipline as the canvas branch above, and for the
          // same reason. `sel` is a `:nth-of-type` path computed against *this*
          // snapshot of the mirror's DOM; the engine re-resolves it against its
          // own, independently-mutating live DOM. hCaptcha's own widgets mutate
          // constantly (an error banner appears, a class toggles, a canvas
          // revision bumps something upstream of the target) — any sibling-count
          // change anywhere in the ancestor chain between snapshot and click
          // shifts every `:nth-of-type(n)` after it, and the query lands on
          // whichever *other* element now sits in that slot. A click aimed at
          // Verify landed on a grid tile instead — same button, same visible
          // position, wrong element three levels down a stale position path.
          // `sel` still rides along as a hint for the engine's own
          // `elementFromPoint` fallback, but position is what actually locates
          // the target now.
          if (box) {
            const body = box.querySelector('.bo-frame-body');
            if (!body || !body.contains(el)) return null;
            const br = body.getBoundingClientRect();
            return { index: frame, sel: selectorWithin(body, el),
              u: Math.max(0, Math.min(1, (ev.clientX - br.left) / Math.max(1, br.width))),
              v: Math.max(0, Math.min(1, (ev.clientY - br.top) / Math.max(1, br.height))) };
          }
          {
            const vw = Math.max(1, (ev.view && ev.view.innerWidth) || 1);
            const vh = Math.max(1, (ev.view && ev.view.innerHeight) || 1);
            return { index: null, sel: selectorFor(el),
              u: Math.max(0, Math.min(1, ev.clientX / vw)),
              v: Math.max(0, Math.min(1, ev.clientY / vh)) };
          }
        };
        let lastPointer = null;
        const sendPointer = (phase, ev) => {
          const t = targetOf(ev);
          if (!t) return;
          const msg = { action: 'pointer', phase, u: t.u, v: t.v };
          if (t.sel) msg.sel = t.sel;
          if (t.surface) msg.surface = t.surface;
          if (t.index !== null && t.index !== undefined) msg.index = String(t.index);
          lastPointer = msg;
          send(msg);
        };
        d.addEventListener('pointerdown', ev => {
          ev.preventDefault();
          dragging = true;
          sendPointer('down', ev);
        }, true);
        d.addEventListener('pointermove', ev => {
          // A real mouse reports at 60-125 Hz and a widget scoring behaviour
          // reads the cadence, so the stream is thinned only enough to stay
          // ahead of the socket — 40 ms produced a visibly robotic 25 Hz.
          const now = Date.now();
          if (!dragging && now - lastMoveSent < 8) return;
          lastMoveSent = now;
          sendPointer('move', ev);
        }, true);
        const endGesture = ev => {
          if (!dragging) return;
          dragging = false;
          sendPointer('up', ev);
          // Whatever the page did while the pointer was down is drawn now.
          if (pendingSnap) { const p = pendingSnap; pendingSnap = null; paint(p); }
        };
        d.addEventListener('pointerup', endGesture, true);

        // ---- raw keyboard forwarding ------------------------------------
        // Sent per keystroke, not as a finished string: a field that validates
        // or masks per character behaves differently when handed a whole value.
        const sendKey = (phase, ev) => {
          // The mirror must not edit itself — it is a copy, and its text would
          // then disagree with the engine's.
          ev.preventDefault();
          lastKeyAt = Date.now();
          const box = ev.target && ev.target.closest && ev.target.closest('.bo-frame');
          const msg = {
            action: 'key', phase, key: ev.key, code: ev.code,
            ctrl: ev.ctrlKey, alt: ev.altKey, shift: ev.shiftKey, meta: ev.metaKey,
            sel: '',
          };
          if (box) msg.index = String(box.getAttribute('data-bo-idx'));
          send(msg);
        };
        d.addEventListener('keydown', ev => sendKey('down', ev), true);
        d.addEventListener('keyup', ev => sendKey('up', ev), true);
        d.addEventListener('pointercancel', endGesture, true);
        // A release outside the mirror still ends the gesture, otherwise the
        // redraw stays frozen for good.
        window.addEventListener('pointerup', () => {
          if (!dragging) return;
          dragging = false;
          // The release can happen outside the mirror document. The engine
          // still needs an up event or the widget remains in a pressed state;
          // replay the last in-bounds point rather than inventing an out-of-
          // viewport coordinate.
          if (lastPointer) send({ ...lastPointer, phase: 'up' });
          if (pendingSnap) { const p = pendingSnap; pendingSnap = null; paint(p); }
        });
      };
    }

    drawCursor(s.cursor || [], s.lastPos);

    $('acts').innerHTML = (s.actionables || []).map(a =>
      `<div class="row" data-sel="${a.sel.replace(/"/g, '&quot;')}">
         <span class="t">${a.tag}${a.type ? '[' + a.type + ']' : ''}</span>
         ${a.label || '<span class="dim">без метки</span>'}
         ${a.value ? `<span class="dim"> = ${a.value}</span>` : ''}
         <span class="dim"> ${a.box ? a.box[2] + '×' + a.box[3] : ''}</span>
       </div>`).join('') || '<div class="dim">нет интерактивных элементов</div>';
    document.querySelectorAll('#acts .row').forEach(r => r.onclick = () => pick(r.dataset.sel));

    // Detection read-out, kept as a one-line badge rather than a tab: vendors ship
    // challenge markup on every page, so the tell is the flip to visible.
    const shown = (s.challenges || []).filter(c =>
      c.display !== 'none' && c.visibility !== 'hidden'
      && /talon_container|talon_challenge_container|h_captcha_challenge/.test(c.id));
    const badge = $('chalbadge');
    badge.className = shown.length ? 'bad' : 'ok';
    badge.textContent = shown.length
      ? `● челлендж показан (${shown.map(c => c.id).join(', ').slice(0, 60)})`
      : '● челлендж скрыт';
  }

  // ---- element picking ----------------------------------------------------------
  function pick(sel) {
    picked = sel;
    $('sel').textContent = sel;
  }

  // Same as selectorFor, but stops at `root` — the frame body — so the result is
  // a selector valid inside the child realm's own document.
  function selectorWithin(root, el) {
    if (el.id) return '#' + CSS.escape(el.id);
    const parts = [];
    while (el && el.nodeType === 1 && el !== root) {
      const p = el.parentNode; if (!p) break;
      const same = [...p.children].filter(c => c.tagName === el.tagName);
      parts.unshift(el.tagName.toLowerCase() + (same.length > 1 ? `:nth-of-type(${same.indexOf(el) + 1})` : ''));
      el = p;
    }
    return parts.join(' > ');
  }

  function selectorFor(el) {
    if (el.id) return '#' + CSS.escape(el.id);
    const parts = [];
    while (el && el.nodeType === 1 && el.tagName !== 'HTML') {
      const p = el.parentNode; if (!p) break;
      const same = [...p.children].filter(c => c.tagName === el.tagName);
      parts.unshift(el.tagName.toLowerCase() + (same.length > 1 ? `:nth-of-type(${same.indexOf(el) + 1})` : ''));
      el = p;
    }
    return parts.join(' > ');
  }

</script>
